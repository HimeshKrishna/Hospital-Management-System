<!DOCTYPE html>
<html>
<head>
    <title>HMS - Register</title>
    <style>
        :root { --bg:#0f172a; --surface:#1e293b; --surface-alt:#334155; --text:#f1f5f9; --muted:#94a3b8; --primary:#6366f1; --accent:#22d3ee; --success:#10b981; --shadow:0 25px 60px rgba(0,0,0,.4); --radius:20px; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:'Segoe UI',sans-serif; background:radial-gradient(circle at 70% 20%,rgba(16,185,129,.12),transparent 40%),radial-gradient(circle at 20% 80%,rgba(99,102,241,.12),transparent 40%),var(--bg); color:var(--text); min-height:100vh; display:grid; place-items:center; padding:24px; }
        .card { width:min(460px,100%); background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:48px 40px; border:1px solid rgba(255,255,255,.06); animation:slideUp .5s ease-out; }
        @keyframes slideUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
        .icon { width:56px;height:56px;background:linear-gradient(135deg,var(--success),var(--accent));border-radius:16px;display:grid;place-items:center;font-size:28px;margin-bottom:24px; }
        h1 { font-size:28px; margin-bottom:6px; }
        .sub { color:var(--muted); margin-bottom:28px; font-size:15px; }
        label { display:block; margin-top:16px; font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
        input { width:100%; padding:12px 14px; margin-top:6px; border-radius:12px; border:1px solid var(--surface-alt); background:var(--bg); color:var(--text); font-size:15px; transition:.25s; }
        input:focus { border-color:var(--success); outline:none; box-shadow:0 0 0 3px rgba(16,185,129,.25); }
        .flash { background:rgba(244,63,94,.12); border:1px solid rgba(244,63,94,.3); color:#fda4af; padding:10px 14px; border-radius:12px; margin-bottom:16px; font-size:14px; }
        button { margin-top:24px; padding:13px; background:linear-gradient(135deg,var(--success),#059669); color:#fff; border:none; border-radius:12px; cursor:pointer; width:100%; font-size:15px; font-weight:600; transition:.25s; }
        button:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(16,185,129,.35); }
        .hint { margin-top:20px; font-size:13px; color:var(--muted); text-align:center; }
        .hint a { color:var(--accent); text-decoration:none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📋</div>
        <h1>Create Account</h1>
        <p class="sub">Register for Hospital Management System</p>
        {% with messages = get_flashed_messages() %}{% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}{% endwith %}
        <form action="/login" method="POST">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" placeholder="Choose a username" required>
            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="Create a password" required>
            <button type="submit">Create Account</button>
        </form>
        <div class="hint">Already have an account? <a href="{{ url_for('home') }}">Sign in</a></div>
    </div>
</body>
</html>
