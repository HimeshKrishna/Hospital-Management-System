<!DOCTYPE html>
<html>
<head>
    <title>Hospital Management System - Login</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-alt: #334155;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #22d3ee;
            --danger: #f43f5e;
            --shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(34, 211, 238, 0.1), transparent 40%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .login-card {
            width: min(460px, 100%);
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 48px 40px;
            border: 1px solid rgba(255,255,255,0.06);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 16px;
            display: grid; place-items: center;
            font-size: 28px;
            margin-bottom: 24px;
        }

        h1 { font-size: 28px; margin-bottom: 6px; }
        .subtitle { color: var(--muted); margin-bottom: 28px; font-size: 15px; }

        label {
            display: block;
            margin-top: 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 6px;
            border-radius: 12px;
            border: 1px solid var(--surface-alt);
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
            transition: 0.25s;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .flash {
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #fda4af;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        button {
            margin-top: 24px;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            font-weight: 600;
            transition: 0.25s;
            letter-spacing: 0.3px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.35);
        }

        .hint {
            margin-top: 20px;
            font-size: 13px;
            color: var(--muted);
            text-align: center;
            line-height: 1.6;
        }

        .hint a { color: var(--accent); text-decoration: none; }
        .hint a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-icon">🏥</div>
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to Hospital Management System</p>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
            <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" placeholder="Enter your username" required>

            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="Enter your password" required>

            <button type="submit">Sign In</button>
        </form>

        <div class="hint">
            Don't have an account? <a href="{{ url_for('home') }}">Register here</a><br>
            First-time users are auto-registered on login.
        </div>
    </div>
</body>
</html>
